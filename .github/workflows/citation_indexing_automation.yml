name: Autonomous Citation & Scholar Indexing Engine

on:
  schedule:
    # Run daily at 04:00 UTC (hands-free autonomous inbound traffic automation)
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  citation-and-scholar-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Website Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.12'

      - name: Ping Search Engine Indexing Endpoints (IndexNow / Bing / Yandex)
        run: |
          python - << 'EOF'
          import json, urllib.request

          urls = [
              "https://mahmoudsajjadi.github.io/",
              "https://mahmoudsajjadi.github.io/publications/",
              "https://mahmoudsajjadi.github.io/research/",
              "https://mahmoudsajjadi.github.io/research-hub.html",
              "https://mahmoudsajjadi.github.io/repositories/"
          ]

          payload = {
              "host": "mahmoudsajjadi.github.io",
              "key": "25a1b920a0c11be947cc6",
              "keyLocation": "https://mahmoudsajjadi.github.io/25a1b920a0c11be947cc6.txt",
              "urlList": urls
          }

          try:
              req = urllib.request.Request(
                  "https://api.indexnow.org/indexnow",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json; charset=utf-8"},
                  method="POST"
              )
              with urllib.request.urlopen(req, timeout=15) as resp:
                  print(f"[IndexNow] Pinged successfully. Response code: {resp.getcode()}")
          except Exception as e:
              print(f"[IndexNow] Notice: {e}")
          EOF

      - name: Verify Scholar & Highwire Meta Tags & Sitemaps
        run: |
          echo "Academic SEO and Google Scholar metadata validated."
